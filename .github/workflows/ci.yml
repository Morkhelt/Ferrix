name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml, so the pinned nightly and the
      # bare-metal target come down without naming them again here.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Install the image and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 xorriso ovmf

      - name: Build the bootable image
        run: make

      # The real test for a kernel: it boots, under both firmware paths, and
      # logs what it should over the serial port.
      - name: Boot it
        run: make test
